on: [push, pull_request]
name: test

jobs:
  test:
    strategy:
      matrix:
        go-version:
        - 1.22.x
        os: [ubuntu-latest]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

        cache: false
    - name: Resolve Go compiler version
      id: go-cache
      run: |
        echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
    - name: Restore Go dependencies and build cache
      uses: actions/cache@v4
      with:
        path: |
          /tmp/stellar-go/pkg/mod
          /tmp/stellar-go-build
        key: cache/${{ github.repository }}/${{ github.ref }}/go/${{ runner.os }}/${{ runner.arch }}/${{ steps.go-cache.outputs.version }}/${{ hashFiles('**/go.sum') }}
    - name: Test
      run: go test ./... -v
      env:
        RAPID7_REGION: ${{ secrets.RAPID7_REGION }}
        RAPID7_API_KEY: ${{ secrets.RAPID7_API_KEY }}
        RAPID7_INVESTIGATION_RRN: ${{ secrets.RAPID7_INVESTIGATION_RRN }}
        RAPID7_ORG_ID: ${{ secrets.RAPID7_ORG_ID }}
    env:
      GOPATH: /tmp/stellar-go
      GOCACHE: /tmp/stellar-go-build
